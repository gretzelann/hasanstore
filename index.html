<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hasan Store POS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f5f4f0;--surface:#ffffff;--surface2:#f9f8f5;--border:#e8e6e0;--border2:#d4d1c8;
    --text:#1a1917;--text2:#6b6860;--text3:#9e9b94;
    --green:#1a7a55;--green-bg:#e8f5ee;--green-light:#d1ede0;
    --amber:#b86800;--amber-bg:#fff4e0;
    --red:#c0392b;--red-bg:#fdf0ee;
    --radius:10px;--radius-sm:6px;--radius-lg:14px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  }
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
  .app{display:grid;grid-template-columns:1fr 360px;height:100vh;max-height:100vh;overflow:hidden;}

  /* LEFT */
  .left{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);}
  .store-logo{height:52px;width:auto;display:block;}
  .tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;}
  .tab{padding:6px 14px;font-size:13px;font-weight:500;border-radius:5px;cursor:pointer;border:none;color:var(--text2);background:transparent;transition:all .15s;}
  .tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .tab:hover:not(.active){color:var(--text);}

  .search-wrap{padding:14px 20px 0;display:flex;gap:10px;}
  .search-input{flex:1;padding:9px 14px 9px 38px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;}
  .search-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,122,85,.1);}
  .search-wrap-inner{flex:1;position:relative;}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none;}

  .cat-row{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;flex-shrink:0;}
  .cat-row::-webkit-scrollbar{height:0;}
  .cat-pill{padding:5px 14px;font-size:12px;font-weight:500;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);white-space:nowrap;transition:all .15s;}
  .cat-pill.active{background:var(--green);color:#fff;border-color:var(--green);}
  .cat-pill:hover:not(.active){border-color:var(--border2);color:var(--text);}

  .product-grid{flex:1;overflow-y:auto;padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;}
  .product-grid::-webkit-scrollbar{width:4px;}
  .product-grid::-webkit-scrollbar-track{background:transparent;}
  .product-grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;user-select:none;}
  .pcard:hover{border-color:var(--green);box-shadow:var(--shadow);transform:translateY(-1px);}
  .pcard:active{transform:translateY(0);}
  .pcard.low{border-color:#f0c060;}
  .pcard.out{opacity:.5;cursor:not-allowed;pointer-events:none;}
  .pcat{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .pname{font-size:13px;font-weight:500;color:var(--text);line-height:1.35;margin-bottom:6px;}
  .pprice{font-size:15px;font-weight:600;color:var(--green);}
  .pstock{margin-top:6px;}
  .sbadge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
  .sok{background:var(--green-bg);color:var(--green);}
  .slow{background:var(--amber-bg);color:var(--amber);}
  .sout{background:var(--red-bg);color:var(--red);}

  /* SERVICES */
  .svc-grid{flex:1;overflow-y:auto;padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;align-content:start;}
  .svc-grid::-webkit-scrollbar{width:4px;}
  .svc-grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
  .svc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px 14px;cursor:pointer;transition:all .15s;user-select:none;text-align:center;}
  .svc-card:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-1px);}
  .svc-card:active{transform:translateY(0);}
  .svc-icon{font-size:30px;margin-bottom:8px;line-height:1;}
  .svc-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.3;margin-bottom:5px;}
  .svc-price{font-size:14px;font-weight:700;color:var(--blue);}
  .svc-unit{font-size:10px;color:var(--text3);margin-top:2px;}
  .svc-group-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:14px 20px 4px;grid-column:1/-1;}

  /* PANES */
  .pane{display:none;flex-direction:column;flex:1;overflow:hidden;}
  .pane.active{display:flex;}
  .pane-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;flex-shrink:0;}
  .pane-title{font-size:15px;font-weight:600;}
  .tbl-wrap{flex:1;overflow-y:auto;padding:0 20px 20px;}
  .tbl-wrap::-webkit-scrollbar{width:4px;}
  .tbl-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;padding:8px 10px;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px;}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--surface2);}

  /* RIGHT */
  .right{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .cart-head{padding:16px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .cart-body{flex:1;overflow-y:auto;padding:10px 14px;}
  .cart-body::-webkit-scrollbar{width:3px;}
  .cart-body::-webkit-scrollbar-thumb{background:var(--border2);}
  .cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text3);}
  .cart-empty-icon{font-size:40px;opacity:.3;}
  .citem{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
  .citem:last-child{border-bottom:none;}
  .cname{flex:1;}
  .cn{font-size:13px;font-weight:500;color:var(--text);line-height:1.3;}
  .cp{font-size:11px;color:var(--text3);margin-top:1px;}
  .qc{display:flex;align-items:center;gap:7px;}
  .qbtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .1s;line-height:1;}
  .qbtn:hover{background:var(--border);}
  .qn{font-size:13px;font-weight:600;min-width:18px;text-align:center;}
  .ctot{font-size:13px;font-weight:600;color:var(--text);min-width:62px;text-align:right;}

  /* DISCOUNT */
  .disc-wrap{padding:12px 14px;border-top:1px solid var(--border);}
  .disc-head{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
  .disc-tabs{display:flex;gap:4px;margin-bottom:8px;}
  .dtab{flex:1;padding:5px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;text-align:center;}
  .dtab.active{background:var(--green-bg);color:var(--green);border-color:var(--green-light);}
  .disc-row{display:flex;gap:6px;}
  .disc-row input{flex:1;padding:7px 10px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;}
  .disc-row input:focus{border-color:var(--green);}
  .disc-quick{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .dqbtn{padding:3px 10px;font-size:11px;font-weight:500;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
  .dqbtn:hover{background:var(--surface2);color:var(--text);border-color:var(--border2);}
  .disc-applied{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--green-bg);border-radius:var(--radius-sm);border:1px solid var(--green-light);}
  .da-text{flex:1;font-size:12px;font-weight:600;color:var(--green);}
  .da-remove{background:none;border:none;cursor:pointer;color:var(--green);font-size:16px;line-height:1;padding:0;}

  /* FOOTER */
  .cart-foot{padding:14px 18px;border-top:1px solid var(--border);}
  .sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:5px;}
  .sum-disc{color:var(--green);font-weight:500;}
  .sum-total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;color:var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .btn-checkout{width:100%;margin-top:12px;padding:12px;font-size:14px;font-weight:600;background:var(--green);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;transition:all .15s;letter-spacing:.2px;}
  .btn-checkout:hover:not(:disabled){background:#155f43;}
  .btn-checkout:disabled{background:var(--surface2);color:var(--text3);cursor:not-allowed;}
  .btn-clearcart{width:100%;margin-top:6px;padding:8px;font-size:13px;font-weight:500;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);transition:all .15s;}
  .btn-clearcart:hover{background:var(--surface2);}

  /* RESTOCK ALERT */
  .restock-wrap{margin:14px 20px 0;border-radius:var(--radius);border:1px solid #e8c040;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;}
  .restock-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#fffbe8;cursor:grab;user-select:none;}
  .restock-head:active{cursor:grabbing;}
  .restock-title{font-size:13px;font-weight:600;color:#8a5c00;display:flex;align-items:center;gap:8px;}
  .restock-count{background:#f0c040;color:#5a3c00;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .restock-chevron{color:#8a5c00;font-size:12px;transition:transform .2s;}
  .restock-body{background:#fffdf0;border-top:1px solid #f0dc80;overflow-y:auto;}
  .restock-item{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid #f5ecb0;gap:10px;}
  .restock-del{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;opacity:.6;border-radius:4px;line-height:1;}
  .restock-del:hover{opacity:1;background:#fee2e2;}
  .restock-item:last-child{border-bottom:none;}
  .restock-info{flex:1;min-width:0;}
  .restock-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .restock-cat{font-size:11px;color:var(--text3);margin-top:1px;}
  .restock-suggest{background:#fff3cd;border:1px solid #f0c040;border-radius:var(--radius-sm);padding:4px 10px;font-size:12px;font-weight:600;color:#7a4f00;white-space:nowrap;}
  .restock-drag-handle{height:10px;background:#f5e880;border-top:1px solid #e0cc50;cursor:ns-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .restock-drag-handle::after{content:'';display:block;width:36px;height:3px;border-radius:3px;background:#c8a030;box-shadow:0 -4px 0 #c8a030,0 4px 0 #c8a030;}

  /* BUTTONS */
  .btn{padding:7px 14px;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:5px;}
  .btn:hover{background:var(--surface2);border-color:var(--border2);}
  .btn-green{background:var(--green);color:#fff;border-color:var(--green);}
  .btn-green:hover{background:#155f43;border-color:#155f43;}
  .btn-red{border-color:#f0a0a0;color:var(--red);}
  .btn-red:hover{background:var(--red-bg);}

  /* METRICS */
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 0;flex-shrink:0;}
  .metrics-period{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 20px 0;flex-shrink:0;}
  .mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .mcard-accent{border-color:var(--green-light);background:var(--green-bg);}
  .mlabel{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  .mval{font-size:22px;font-weight:700;color:var(--text);}
  .mval-accent{color:var(--green);}
  .mval-sm{font-size:16px;}

  /* PERIOD TABS */
  .period-tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin:14px 20px 0;}
  .ptab{flex:1;padding:6px 4px;font-size:12px;font-weight:500;border-radius:4px;cursor:pointer;border:none;color:var(--text2);background:transparent;transition:all .15s;text-align:center;}
  .ptab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .ptab:hover:not(.active){color:var(--text);}

  .sitem{padding:12px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
  .sitem:hover{background:var(--surface2);}
  .sitem-top{display:flex;justify-content:space-between;font-size:13px;font-weight:500;}
  .sitem-sub{font-size:11px;color:var(--text3);margin-top:3px;}
  .sitem-items{margin-top:7px;display:flex;flex-direction:column;gap:2px;}
  .sitem-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--text2);padding:2px 0;}
  .sitem-row-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;}
  .sitem-row-qty{color:var(--text3);font-size:11px;white-space:nowrap;padding-right:8px;}
  .sitem-row-price{font-weight:500;color:var(--text);white-space:nowrap;}
  .sitem-divider{border:none;border-top:1px dashed var(--border);margin:5px 0;}
  .sitem-total-row{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text);}
  .disc-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--green-bg);color:var(--green);margin-left:6px;vertical-align:middle;}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px);}
  .modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.15);border:1px solid var(--border);}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--text);}
  .fg{margin-bottom:13px;}
  .fg label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
  .fg input,.fg select{width:100%;padding:9px 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;font-family:inherit;}
  .fg input:focus,.fg select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,122,85,.1);}
  .mactions{display:flex;gap:8px;margin-top:18px;}
  .mactions button{flex:1;}

  /* RECEIPT */
  .receipt{width:290px;background:var(--surface);}
  .rhead{text-align:center;padding-bottom:14px;border-bottom:1px dashed var(--border2);}
  .rlogo{display:flex;justify-content:center;margin-bottom:6px;}
  .rdate{font-size:12px;color:var(--text3);margin-top:2px;}
  .rrows{padding:12px 0;}
  .rrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--text);}
  .rdivider{border:none;border-top:1px dashed var(--border2);margin:10px 0;}
  .rtotal{display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:var(--text);}
  .rthanks{text-align:center;font-size:11px;color:var(--text3);margin-top:14px;padding-top:12px;border-top:1px dashed var(--border2);}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* EMPTY */
  .empty-state{padding:32px;text-align:center;color:var(--text3);font-size:13px;}

  /* CALCULATOR */
  .calc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(3px);}
  .calc-modal{background:var(--surface);border-radius:var(--radius-lg);width:300px;box-shadow:0 24px 60px rgba(0,0,0,.18);border:1px solid var(--border);overflow:hidden;}
  .calc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  .calc-header span{font-size:14px;font-weight:600;color:var(--text);}
  .calc-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text3);line-height:1;padding:2px 8px;border-radius:4px;}
  .calc-close:hover{background:var(--surface2);color:var(--text);}
  .calc-display{background:#1a1917;padding:16px 18px 12px;text-align:right;}
  .calc-expr{font-size:12px;color:#888;min-height:18px;margin-bottom:4px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .calc-val{font-size:34px;font-weight:700;color:#fff;letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);}
  .cbtn{padding:18px 10px;font-size:17px;font-weight:500;border:none;cursor:pointer;transition:background .1s;font-family:inherit;user-select:none;}
  .cbtn:active{filter:brightness(.88);}
  .cbtn-num{background:var(--surface);color:var(--text);}
  .cbtn-num:hover{background:var(--surface2);}
  .cbtn-op{background:#f0ede6;color:#9a5a00;font-weight:600;}
  .cbtn-op:hover{background:#e6e0d4;}
  .cbtn-fn{background:#e8e6e0;color:var(--text2);font-size:14px;}
  .cbtn-fn:hover{background:#dedad2;}
  .cbtn-eq{background:var(--green);color:#fff;font-weight:700;}
  .cbtn-eq:hover{background:#155f43;}
  .cbtn-wide{grid-column:span 2;}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- LEFT PANEL -->
  <div class="left">
    <div class="topbar">
      <!-- Inline SVG logo matching the Hasan Store brand -->
      <svg class="store-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="96" fill="#FFD740"/>
        <!-- House icon -->
        <polygon points="100,28 138,60 62,60" fill="white"/>
        <rect x="68" y="60" width="64" height="44" rx="3" fill="white"/>
        <rect x="80" y="67" width="40" height="30" rx="3" fill="#1B4DBF"/>
        <line x1="100" y1="67" x2="100" y2="97" stroke="white" stroke-width="3"/>
        <line x1="80" y1="82" x2="120" y2="82" stroke="white" stroke-width="3"/>
        <!-- HASAN text -->
        <text x="100" y="140"
          font-family="Fredoka One, Arial Rounded MT Bold, Arial Black, sans-serif"
          font-size="50" font-weight="900"
          fill="#1B4DBF" stroke="white" stroke-width="7"
          stroke-linejoin="round" text-anchor="middle"
          paint-order="stroke fill">HASAN</text>
        <!-- STORE text -->
        <text x="100" y="170"
          font-family="Fredoka One, Arial Rounded MT Bold, Arial Black, sans-serif"
          font-size="26" font-weight="700" letter-spacing="3"
          fill="#1B4DBF" stroke="white" stroke-width="5"
          stroke-linejoin="round" text-anchor="middle"
          paint-order="stroke fill">STORE</text>
      </svg>

      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn" onclick="openCalc()" title="Open Calculator">🧮 Calc</button>
        <div class="tabs">
          <button class="tab active" onclick="switchTab('pos')">🛒 POS</button>
          <button class="tab" onclick="switchTab('inventory')">📦 Inventory</button>

function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let products=ld('hs_products',DEFAULT_PRODUCTS);
let sales=ld('hs_sales',[]);
let promos=ld('hs_promos',DEFAULT_PROMOS);
let cart=[];
let editId=null,editPromoId=null;
let nextId=ld('hs_nid',DEFAULT_PRODUCTS.length+1);
let nextPid=ld('hs_npid',DEFAULT_PROMOS.length+1);
let activeCat='All';
let discMode='percent';
let appliedDisc=null;

const fmt=n=>'₱'+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const ts=()=>new Date().toLocaleString('en-PH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const cats=()=>[...new Set(products.map(p=>p.category))];

function catIcon(name){const c=CATS.find(x=>x.name===name);return c?c.icon:'📦';}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['pos','inventory','sales','promos'][i]===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+t).classList.add('active');
  if(t==='inventory')renderInv();
  if(t==='sales')renderSales();
  if(t==='promos')renderPromos();
}

function renderCats(){
  const el=document.getElementById('cat-row');
  const svc=`<button class="cat-pill ${activeCat==='__svc__'?'active':''}" onclick="setCat('__svc__')" style="${activeCat==='__svc__'?'background:var(--blue);border-color:var(--blue);':''}">⚡ Services</button>`;
  const all=`<button class="cat-pill ${activeCat==='All'?'active':''}" onclick="setCat('All')">All</button>`;
  el.innerHTML=svc+all+cats().map(c=>`<button class="cat-pill ${activeCat===c?'active':''}" onclick="setCat('${c}')">${catIcon(c)} ${c}</button>`).join('');
}
function setCat(c){
  activeCat=c;
  renderCats();
  const pg=document.getElementById('product-grid');
  const sp=document.getElementById('svc-panel');
  if(c==='__svc__'){pg.style.display='none';sp.style.display='grid';renderServices();}
  else{pg.style.display='grid';sp.style.display='none';renderProducts();}
}

function renderServices(){
  const el=document.getElementById('svc-panel');
  let html='';
  let lastGroup='';
  SERVICES.forEach(s=>{
    if(s.group!==lastGroup){html+=`<div class="svc-group-label">${s.group}</div>`;lastGroup=s.group;}
    html+=`<div class="svc-card" onclick="addServiceToCart('${s.id}')">
      <div class="svc-icon">${s.icon}</div>
      <div class="svc-name">${s.name}</div>
      <div class="svc-price">${s.variable?'Enter amount':fmt(s.price)}</div>
      <div class="svc-unit">${s.unit}</div>
    </div>`;
  });
  el.innerHTML=html;
}

function addServiceToCart(id){
  const s=SERVICES.find(x=>x.id===id);
  if(!s)return;
  if(s.variable){
    openModal(`<div class="modal">
      <h3>${s.icon} ${s.name}</h3>
      <div class="fg"><label>Fee / Amount to charge (₱)</label><input id="svc-amt" type="number" min="0" step="0.01" placeholder="0.00" /></div>
      <div class="mactions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-green" onclick="confirmSvcAdd('${s.id}')">Add to Order</button>
      </div>
    </div>`);
    setTimeout(()=>{const el=document.getElementById('svc-amt');if(el)el.focus();},50);
  } else {
    const existing=cart.find(x=>x.svcId===s.id);
    if(existing){existing.qty++;renderCart();toast(`${s.name} qty updated.`);}
    else{cart.push({id:'svc_'+Date.now(),svcId:s.id,name:s.name,price:s.price,qty:1,isService:true});renderCart();toast(`${s.name} added!`);}
  }
}

function confirmSvcAdd(id){
  const s=SERVICES.find(x=>x.id===id);
  const amt=parseFloat(document.getElementById('svc-amt').value);
  if(isNaN(amt)||amt<=0){toast('Enter a valid amount.');return;}
  cart.push({id:'svc_'+Date.now(),svcId:s.id,name:s.name,price:amt,qty:1,isService:true});
  closeModal();renderCart();toast(`${s.name} added!`);
}

function renderProducts(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const el=document.getElementById('product-grid');
  let list=products.filter(p=>(p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))&&(activeCat==='All'||p.category===activeCat));
  if(!list.length){el.innerHTML=`<div class="empty-state" style="grid-column:1/-1;">No products found.</div>`;return;}
  el.innerHTML=list.map(p=>{
    const cls=p.stock<=0?'out':p.stock<=5?'low':'';
    const badge=p.stock<=0?`<span class="sbadge sout">Out of stock</span>`:p.stock<=5?`<span class="sbadge slow">Low: ${p.stock}</span>`:`<span class="sbadge sok">${p.stock} left</span>`;
    return `<div class="pcard ${cls}" onclick="addToCart(${p.id})">
      <div class="pcat">${catIcon(p.category)} ${p.category}</div>
      <div class="pname">${p.name}</div>
      <div class="pprice">${fmt(p.price)}</div>
      <div class="pstock">${badge}</div>
    </div>`;
  }).join('');
}

function addToCart(id){
  const p=products.find(x=>x.id===id);
  if(!p||p.stock<=0)return;
  const ci=cart.find(x=>x.id===id);
  if(ci){if(ci.qty>=p.stock){toast('Not enough stock!');return;}ci.qty++;}
  else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
  renderCart();
}

function chQty(id,d){
  const ci=cart.find(x=>x.id===id);
  if(!ci)return;
  ci.qty+=d;
  if(ci.qty<=0){cart=cart.filter(x=>x.id!==id);}
  else if(!ci.isService){
    const p=products.find(x=>x.id===ci.id);
    if(p&&ci.qty>p.stock){ci.qty=p.stock;toast('Max stock reached.');}
  }
  renderCart();
}

function calcDisc(sub){
  if(!appliedDisc)return 0;
  if(appliedDisc.type==='percent')return Math.min(sub,sub*appliedDisc.value/100);
  return Math.min(sub,appliedDisc.value);
}

function renderCart(){
  const el=document.getElementById('cart-body');
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const da=calcDisc(sub);
  const tot=Math.max(0,sub-da);
  document.getElementById('subtotal').textContent=fmt(sub);
  document.getElementById('total').textContent=fmt(tot);
  document.getElementById('btn-co').disabled=!cart.length;
  const dr=document.getElementById('disc-row');
  if(appliedDisc&&da>0){
    dr.style.display='flex';
    document.getElementById('disc-lbl').textContent=appliedDisc.label;
    document.getElementById('disc-amt').textContent='-'+fmt(da);
  } else dr.style.display='none';
  if(!cart.length){el.innerHTML=`<div class="cart-empty"><div class="cart-empty-icon">🛒</div><span>No items added yet</span></div>`;return;}
  el.innerHTML=cart.map(i=>`<div class="citem">
    <div class="cname"><div class="cn">${i.name}</div><div class="cp">${fmt(i.price)} each</div></div>
    <div class="qc">
      <button class="qbtn" onclick="chQty(${i.id},-1)">−</button>
      <span class="qn">${i.qty}</span>
      <button class="qbtn" onclick="chQty(${i.id},1)">+</button>
    </div>
    <div class="ctot">${fmt(i.price*i.qty)}</div>
  </div>`).join('');
}

function clearCart(){cart=[];appliedDisc=null;renderCart();renderDiscInput();}

function setDiscMode(m){
  discMode=m;
  ['percent','fixed','code'].forEach(x=>document.getElementById('dt-'+x).classList.toggle('active',x===m));
  renderDiscInput();
}

function renderDiscInput(){
  const ia=document.getElementById('disc-input');
  const aa=document.getElementById('disc-applied');
  if(appliedDisc){
    ia.innerHTML='';
    aa.innerHTML=`<div class="disc-applied"><span class="da-text">🏷 ${appliedDisc.label}</span><button class="da-remove" onclick="removeDisc()">✕</button></div>`;
    return;
  }
  aa.innerHTML='';
  if(discMode==='percent'){
    ia.innerHTML=`<div class="disc-row"><input type="number" id="dv" placeholder="Enter %" min="0" max="100"/><button class="btn btn-green" onclick="applyManual()" style="white-space:nowrap;padding:7px 12px;">Apply</button></div>
    <div class="disc-quick"><span style="font-size:11px;color:var(--text3);align-self:center;">Quick:</span>
      <button class="dqbtn" onclick="applyQP(5)">5%</button>
      <button class="dqbtn" onclick="applyQP(10)">10%</button>
      <button class="dqbtn" onclick="applyQP(15)">15%</button>
      <button class="dqbtn" onclick="applyQP(20)">20%</button>
      <button class="dqbtn" onclick="applyQP(50)">50%</button>
    </div>`;
  } else if(discMode==='fixed'){
    ia.innerHTML=`<div class="disc-row"><input type="number" id="dv" placeholder="Enter ₱ amount" min="0"/><button class="btn btn-green" onclick="applyManual()" style="white-space:nowrap;padding:7px 12px;">Apply</button></div>
    <div class="disc-quick"><span style="font-size:11px;color:var(--text3);align-self:center;">Quick:</span>
      <button class="dqbtn" onclick="applyQF(10)">₱10</button>
      <button class="dqbtn" onclick="applyQF(20)">₱20</button>
      <button class="dqbtn" onclick="applyQF(50)">₱50</button>
      <button class="dqbtn" onclick="applyQF(100)">₱100</button>
    </div>`;
  } else {
    const hint=promos.length?`Active: ${promos.map(p=>`<strong>${p.code}</strong>`).join(', ')}`:'No promo codes yet.';
    ia.innerHTML=`<div class="disc-row"><input type="text" id="dc" placeholder="Enter promo code" oninput="this.value=this.value.toUpperCase()"/><button class="btn btn-green" onclick="applyCode()" style="white-space:nowrap;padding:7px 12px;">Apply</button></div>
    <div style="margin-top:6px;font-size:11px;color:var(--text3);">${hint}</div>`;
  }
}

function applyManual(){
  const v=parseFloat(document.getElementById('dv').value);
  if(isNaN(v)||v<=0){toast('Enter a valid value.');return;}
  if(discMode==='percent'&&v>100){toast('Max 100%.');return;}
  appliedDisc={type:discMode,value:v,label:discMode==='percent'?`${v}% discount`:`₱${v.toFixed(2)} off`};
  renderDiscInput();renderCart();toast('Discount applied!');
}
function applyQP(v){appliedDisc={type:'percent',value:v,label:`${v}% discount`};renderDiscInput();renderCart();toast(`${v}% discount applied!`);}
function applyQF(v){appliedDisc={type:'fixed',value:v,label:`₱${v} off`};renderDiscInput();renderCart();toast(`₱${v} discount applied!`);}
function applyCode(){
  const code=(document.getElementById('dc').value||'').trim().toUpperCase();
  const p=promos.find(x=>x.code===code);
  if(!p){toast('Invalid promo code.');return;}
  appliedDisc={type:p.type,value:p.value,label:`${p.code}: ${p.description}`};
  renderDiscInput();renderCart();toast('Promo code applied!');
}
function removeDisc(){appliedDisc=null;renderDiscInput();renderCart();}

function checkout(){
  if(!cart.length)return;
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const da=calcDisc(sub);
  const tot=Math.max(0,sub-da);
  const items=cart.map(i=>({...i}));
  items.forEach(i=>{if(!i.isService){const p=products.find(x=>x.id===i.id);if(p)p.stock-=i.qty;}});
  sv('hs_products',products);
  const txn={id:Date.now(),time:ts(),items,subtotal:sub,discAmt:da,discount:appliedDisc?{...appliedDisc}:null,total:tot};
  sales.unshift(txn);sv('hs_sales',sales);
  showReceipt(txn);
  cart=[];appliedDisc=null;
  renderCart();renderDiscInput();renderProducts();
}

const RESTOCK_TARGET=20;
let restockOpen=true;
let restockBodyH=120;

function toggleRestock(){
  restockOpen=!restockOpen;
  const body=document.getElementById('rb');
  const chev=document.getElementById('rc');
  const handle=document.getElementById('rdh');
  if(body)body.style.display=restockOpen?'block':'none';
  if(handle)handle.style.display=restockOpen?'flex':'none';
  if(chev)chev.style.transform=restockOpen?'':'rotate(-90deg)';
}

function renderRestockAlert(){
  const el=document.getElementById('restock-alert');
  const low=products.filter(p=>p.stock<=5).sort((a,b)=>a.stock-b.stock);
  if(!low.length){el.innerHTML='';return;}
  const rows=low.map(p=>{
    const badge=p.stock<=0
      ?`<span class="sbadge sout">Out of stock</span>`
      :`<span class="sbadge slow">${p.stock} left</span>`;
    const suggest=Math.max(1,RESTOCK_TARGET-p.stock);
    return `<div class="restock-item">
      <div class="restock-info">
        <div class="restock-name">${p.name}</div>
        <div class="restock-cat">${catIcon(p.category)} ${p.category}</div>
      </div>
      ${badge}
      <div class="restock-suggest">Buy ${suggest}</div>
      <button class="restock-del" onclick="delFromRestock(${p.id})" title="Delete product">🗑️</button>
    </div>`;
  }).join('');
  const bodyH=restockBodyH?`height:${restockBodyH}px;max-height:${restockBodyH}px;overflow-y:auto;`:'';
  el.innerHTML=`<div class="restock-wrap">
    <div class="restock-head" onclick="toggleRestock()">
      <div class="restock-title">
        ⚠️ Restock needed
        <span class="restock-count">${low.length} item${low.length>1?'s':''}</span>
      </div>
      <span id="rc" class="restock-chevron" style="transform:${restockOpen?'':'rotate(-90deg)'}">▼</span>
    </div>
    <div class="restock-body" id="rb" style="display:${restockOpen?'block':'none'};${bodyH}">${rows}</div>
    <div class="restock-drag-handle" id="rdh" style="display:${restockOpen?'flex':'none'};" onmousedown="startRestockDrag(event)"></div>
  </div>`;
}

function delFromRestock(id){
  if(!confirm('Delete this product from inventory?'))return;
  products=products.filter(x=>x.id!==id);
  sv('hs_products',products);
  renderInv();
}

function startRestockDrag(e){
  e.preventDefault();
  e.stopPropagation();
  const body=document.getElementById('rb');
  if(!body)return;
  const startY=e.clientY;
  const startH=body.offsetHeight||120;
  document.body.style.cursor='ns-resize';
  function onMove(ev){
    const dy=ev.clientY-startY;
    restockBodyH=Math.max(60,startH+dy);
    body.style.height=restockBodyH+'px';
    body.style.maxHeight=restockBodyH+'px';
    body.style.overflowY='auto';
  }
  function onUp(){
    document.body.style.cursor='';
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function renderInv(){
  renderRestockAlert();
  document.getElementById('inv-tbody').innerHTML=products.map(p=>{
    const sc=p.stock<=0?'sout':p.stock<=5?'slow':'sok';

let salesPeriod='day';

function setSalesPeriod(p){
  salesPeriod=p;
  document.querySelectorAll('.ptab').forEach(el=>el.classList.toggle('active',el.dataset.p===p));
  renderSalesPeriod();
}

function periodStart(p){
  const now=new Date();
  if(p==='day'){const d=new Date(now);d.setHours(0,0,0,0);return d;}
  if(p==='week'){
    const d=new Date(now);
    const day=d.getDay();
    d.setDate(d.getDate()-(day===0?6:day-1)); // Monday start
    d.setHours(0,0,0,0);return d;
  }
  if(p==='month'){return new Date(now.getFullYear(),now.getMonth(),1);}
  if(p==='year'){return new Date(now.getFullYear(),0,1);}
  return new Date(0);
}

function periodLabel(p){
  return {day:"Today's",week:"This week's",month:"This month's",year:"This year's"}[p];
}

  const tr=sales.reduce((s,x)=>s+x.total,0);
  document.getElementById('metrics').innerHTML=`
    <div class="mcard"><div class="mlabel">All-time revenue</div><div class="mval">${fmt(tr)}</div></div>
    <div class="mcard"><div class="mlabel">All-time transactions</div><div class="mval">${sales.length}</div></div>`;
  renderSalesPeriod();
}

function renderSalesPeriod(){
  const start=periodStart(salesPeriod);
  const filtered=sales.filter(x=>new Date(x.id)>=start);

  document.getElementById('period-title').textContent=`${label.replace("'s",'')} transactions`;
  document.getElementById('period-metrics').innerHTML=`
    <div class="mcard mcard-accent" style="grid-column:span 2;">
      <div class="mlabel">${label} revenue</div>
      <div class="mval mval-accent">${fmt(rev)}</div>
    </div>
    <div class="mcard mcard-accent" style="grid-column:span 2;">
      <div class="mlabel">${label} transactions</div>
      <div class="mval mval-accent mval-sm">${filtered.length} txn · ${filtered.reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.qty,0),0)} pcs sold</div>
    </div>`;

  const el=document.getElementById('sales-list');
  if(!filtered.length){el.innerHTML=`<div class="empty-state">No transactions ${salesPeriod==='day'?'today':salesPeriod==='week'?'this week':salesPeriod==='month'?'this month':'this year'}.</div>`;return;}
  el.innerHTML=filtered.map(s=>{

    const discRow=s.discAmt>0?`
      <div class="sitem-row" style="color:var(--green);">

      </div>`:'';
    return `<div class="sitem" onclick="showReceiptDetail(${s.id})">
      <div class="sitem-top">
        <span style="color:var(--text3);font-size:11px;">#${s.id}</span>
        <span style="color:var(--text3);font-weight:400;font-size:11px;">${s.time}</span>
      </div>
      <div class="sitem-items">${itemRows}${discRow}</div>
      <hr class="sitem-divider"/>
      <div class="sitem-total-row">
        <span>${s.items.reduce((a,i)=>a+i.qty,0)} pc${s.items.reduce((a,i)=>a+i.qty,0)!==1?'s':''} · ${s.items.length} type${s.items.length!==1?'s':''}</span>

// CALCULATOR
let calcDisplay='0',calcExpr='',calcOp=null,calcPrev=null,calcReset=false;

function openCalc(){document.getElementById('calc-overlay').style.display='flex';updateCalcUI();}
function closeCalc(){document.getElementById('calc-overlay').style.display='none';}

function updateCalcUI(){
  document.getElementById('calc-val').textContent=calcDisplay;
  document.getElementById('calc-expr').textContent=calcExpr;
}

function calcInput(v){
  if(v==='C'){calcDisplay='0';calcExpr='';calcOp=null;calcPrev=null;calcReset=false;}
  else if(v==='pm'){if(calcDisplay!=='0')calcDisplay=calcDisplay.startsWith('-')?calcDisplay.slice(1):'-'+calcDisplay;}
  else if(v==='%'){calcDisplay=fmtCalc(parseFloat(calcDisplay)/100);}
  else if(v==='.'){
    if(calcReset){calcDisplay='0.';calcReset=false;updateCalcUI();return;}
    if(!calcDisplay.includes('.'))calcDisplay+='.';
  } else if('0123456789'.includes(v)){
    if(calcReset||calcDisplay==='0'){calcDisplay=v;calcReset=false;}
    else if(calcDisplay.replace('-','').length<12)calcDisplay+=v;
  } else if('+-*/'.includes(v)){
    const cur=parseFloat(calcDisplay);
    if(calcOp!==null&&!calcReset){
      const r=calcOperate(calcPrev,cur,calcOp);
      calcDisplay=fmtCalc(r);calcPrev=r;
    } else {calcPrev=cur;}
    calcExpr=fmtCalc(calcPrev)+' '+calcOpSym(v);
    calcOp=v;calcReset=true;
  } else if(v==='='){
    if(calcOp!==null&&calcPrev!==null){
      const cur=parseFloat(calcDisplay);
      const r=calcOperate(calcPrev,cur,calcOp);
      calcExpr=fmtCalc(calcPrev)+' '+calcOpSym(calcOp)+' '+fmtCalc(cur)+' =';
      calcDisplay=fmtCalc(r);
      calcOp=null;calcPrev=null;calcReset=true;
    }
  }
  updateCalcUI();
}

function calcOperate(a,b,op){
  if(op==='+')return a+b;
  if(op==='-')return a-b;
  if(op==='*')return a*b;
  if(op==='/')return b===0?NaN:a/b;
  return b;
}
function calcOpSym(op){return op==='*'?'×':op==='/'?'÷':op;}
function fmtCalc(n){
  if(!isFinite(n)||isNaN(n))return 'Error';
  return String(parseFloat(n.toPrecision(10)));
}

document.addEventListener('keydown',function(e){
  if(document.getElementById('calc-overlay').style.display==='none')return;
  if('0123456789'.includes(e.key)){calcInput(e.key);e.preventDefault();}
  else if(e.key==='.'){calcInput('.');e.preventDefault();}
  else if(e.key==='+'||e.key==='-'||e.key==='*'||e.key==='/'){calcInput(e.key);e.preventDefault();}
  else if(e.key==='Enter'||e.key==='='){calcInput('=');e.preventDefault();}
  else if(e.key==='Backspace'){
    if(calcDisplay.length>1)calcDisplay=calcDisplay.slice(0,-1);
    else calcDisplay='0';
    updateCalcUI();e.preventDefault();
  } else if(e.key==='Escape'){closeCalc();}
});
